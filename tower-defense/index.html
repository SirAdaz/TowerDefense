<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Tower defense simple : un chemin, une tourelle à améliorer, des vagues sans fin." />
    <meta name="color-scheme" content="dark" />
    <title>Tower defense</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="topbar-start">
          <a class="back-link" href="/">← Jeux</a>
          <h1 class="brand">Tower defense</h1>
        </div>
        <dl class="stats">
          <div class="stat">
            <dt>Vague</dt>
            <dd id="stat-wave">0</dd>
          </div>
          <div class="stat">
            <dt>Vies</dt>
            <dd id="stat-lives">20</dd>
          </div>
          <div class="stat">
            <dt>Argent</dt>
            <dd id="stat-money">150 $</dd>
          </div>
          <div class="stat">
            <dt>Record</dt>
            <dd id="stat-record">0</dd>
          </div>
        </dl>
      </header>

      <main class="layout">
        <section class="board-area" aria-labelledby="board-title">
          <h2 id="board-title" class="sr-only">Carte</h2>
          <div class="board">
            <canvas id="board-canvas" aria-hidden="true"></canvas>
            <div
              id="board-cells"
              class="cells"
              role="group"
              aria-label="Cases de la carte. Flèches pour se déplacer, Entrée pour poser ou sélectionner une tourelle."
            ></div>
            <p id="board-banner" class="banner" hidden>En pause</p>
          </div>
        </section>

        <aside class="panel" aria-label="Commandes">
          <section class="card" aria-labelledby="waves-title">
            <h2 id="waves-title">Vagues</h2>
            <p id="wave-status" class="status"></p>
            <progress id="wave-countdown" max="10" value="0" aria-label="Temps avant la vague suivante" hidden></progress>
            <button id="next-wave" type="button" class="btn btn-primary">Lancer la vague 1</button>
            <div class="btn-row">
              <button id="pause" type="button" class="btn" aria-keyshortcuts="P">Pause</button>
              <button id="speed" type="button" class="btn" aria-pressed="false">Vitesse ×2</button>
            </div>
          </section>

          <section class="card" aria-labelledby="tower-title">
            <h2 id="tower-title">Tourelle</h2>
            <p id="tower-hint" class="status">
              Cliquez une case libre pour poser une tourelle (50 $). Cliquez une tourelle pour l'améliorer ou la vendre.
            </p>
            <div id="tower-details" hidden>
              <ul class="gauges">
                <li class="gauge" data-gauge="damage">
                  <div class="gauge-head">
                    <span class="gauge-name">Dégâts</span>
                    <span id="gauge-damage-value" class="gauge-value"></span>
                  </div>
                  <div id="gauge-damage-pips" class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
                  <button id="upgrade-damage" type="button" class="btn"></button>
                </li>
                <li class="gauge" data-gauge="range">
                  <div class="gauge-head">
                    <span class="gauge-name">Portée</span>
                    <span id="gauge-range-value" class="gauge-value"></span>
                  </div>
                  <div id="gauge-range-pips" class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
                  <button id="upgrade-range" type="button" class="btn"></button>
                </li>
                <li class="gauge" data-gauge="rate">
                  <div class="gauge-head">
                    <span class="gauge-name">Cadence</span>
                    <span id="gauge-rate-value" class="gauge-value"></span>
                  </div>
                  <div id="gauge-rate-pips" class="pips" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
                  <button id="upgrade-rate" type="button" class="btn"></button>
                </li>
              </ul>
              <button id="sell" type="button" class="btn btn-danger"></button>
            </div>
          </section>

          <button id="new-game" type="button" class="btn btn-quiet">Nouvelle partie</button>
        </aside>
      </main>

      <p id="announcer" class="sr-only" role="status" aria-live="polite"></p>

      <dialog id="game-over" class="dialog" aria-labelledby="game-over-title">
        <h2 id="game-over-title">Partie terminée</h2>
        <p id="game-over-wave" class="dialog-score"></p>
        <p id="game-over-record" class="status"></p>
        <button id="game-over-restart" type="button" class="btn btn-primary">Nouvelle partie</button>
      </dialog>
    </div>
    <script type="module" src="/src/tower-defense/main.ts"></script>
  </body>
</html>
