# Sert le build statique : l'accueil à la racine, un dossier par jeu. Les fichiers de dist/assets portent un hash :
# cache long ; les pages HTML ne sont jamais en cache.
# Un add_header dans un bloc location annule ceux du niveau server : les en-têtes de sécurité sont donc inclus dans
# chaque location (security-headers.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Redirections relatives (/tower-defense -> /tower-defense/) : justes derrière un proxy, quel que soit son port.
    absolute_redirect off;

    # Fichiers cachés (.git, .env…) : jamais servis, même si l'un d'eux arrivait dans l'image.
    location ~ /\. {
        include /etc/nginx/snippets/security-headers.conf;
        return 404;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Accueil : la page exacte, rien d'autre. Une adresse inconnue donne une 404, pas l'accueil.
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files /index.html =404;
    }

    # Un jeu : toute adresse de son dossier retombe sur sa page.
    location /tower-defense/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /tower-defense/index.html;
    }

    location /nuit-blanche/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /nuit-blanche/index.html;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
