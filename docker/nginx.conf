# Sert le build statique du jeu. Les fichiers de dist/assets portent un hash : cache long ; index.html jamais en cache.
# Un add_header dans un bloc location annule ceux du niveau server : les en-têtes de sécurité sont donc inclus dans
# chaque location (security-headers.conf).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
